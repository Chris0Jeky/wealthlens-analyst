name: CI

# ONE job by design (the plan's engineering cap applies to CI too):
# golden-set schema validation + deterministic eval checks, plus the package's
# own lint/type/test suite so scaffolding stubs stay importable and
# strict-mypy clean.
# RAGAS is intentionally NOT run in CI (model calls cost money; the spend-cap
# story starts with the CI bill).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly catch-all: dependency/stub drift (e.g. a new mypy release that
  # breaks strict typing) should not go unnoticed while the repo is idle.
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyst:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package (dev extras include jsonschema)
        run: python -m pip install -e ".[dev]"

      - name: Lint + type-check (ruff, strict mypy)
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy

      - name: Tests
        run: python -m pytest -q

      - name: Golden schema validation + deterministic checks
        run: python evals/checks/deterministic.py
