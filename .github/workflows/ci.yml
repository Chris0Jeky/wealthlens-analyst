name: CI

# ONE job by design (the plan's engineering cap applies to CI too):
# golden-set schema validation + deterministic eval checks, plus the package's
# own lint/type/test suite so scaffolding stubs stay importable and
# strict-mypy clean.
# RAGAS is intentionally NOT run in CI (model calls cost money; the spend-cap
# story starts with the CI bill).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly catch-all: dependency/stub drift (e.g. a new mypy release that
  # breaks strict typing) should not go unnoticed while the repo is idle.
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyst:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Match docker-compose.yml's tag; actions remain SHA-pinned below.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wealthlens
          POSTGRES_PASSWORD: wealthlens
          POSTGRES_DB: analyst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealthlens -d analyst"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Disposable CI database; these are test-only credentials, as in compose.
      DATABASE_URL: postgresql+psycopg://wealthlens:wealthlens@localhost:5432/analyst
      WEALTHLENS_TEST_DATABASE_URL: postgresql+psycopg://wealthlens:wealthlens@localhost:5432/analyst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install package (dev extras include jsonschema)
        run: python -m pip install -e ".[dev]"

      - name: Lint + type-check (ruff, strict mypy)
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy

      - name: Migrate Postgres
        run: python -m alembic upgrade head

      - name: Tests
        run: python -m pytest -q -rs --junitxml=pytest-results.xml

      - name: Require tests to run without skips
        run: |
          python - <<'PY'
          from xml.etree import ElementTree

          report = ElementTree.parse("pytest-results.xml")
          if report.findall(".//testcase/skipped"):
              raise SystemExit("CI must run every test, including the migrated Postgres cases; skips are forbidden")
          PY

      - name: Golden schema validation + deterministic checks
        run: python evals/checks/deterministic.py
