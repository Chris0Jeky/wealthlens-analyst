services:
  # Postgres + pgvector for the WealthLens Analyst (ADR 0001).
  # Local dev only — matches .env.example. Start with: make db-up
  analyst-db:
    image: pgvector/pgvector:pg17
    container_name: wealthlens-analyst-db
    environment:
      # Local-dev credentials only (placeholders, not secrets); production
      # values come from the deployment environment, never this file.
      POSTGRES_USER: wealthlens
      POSTGRES_PASSWORD: wealthlens
      POSTGRES_DB: analyst
    ports:
      - "15432:5432"  # 5432-5433 sit in a Windows excluded port range on the dev box
    volumes:
      - analyst_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthlens -d analyst"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  analyst_pgdata:
